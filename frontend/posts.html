<html>
    <head>المقالات</head>
    <style>
        body {font-family: Arial;max-width: 800px; margin: 20px auto;}
        .post{border: 1px solid #ccc;padding: 15px;margin: 10px 0;border-radius: 8px;}
        .post h3{margin: 0 0 10px0;color: #333;}
        .author{color: #666;font-size: 14px;}
        .logout{background: red;color: white;padding: 10px;border: none;cursor: pointer;
        border-radius: 5px;margin-bottom: 20px;}

    </style>
    <body>
        <button onclick="logout()">تسجيل الخروج</button>
        <h1>كل المقالات</h1>
        <div id="posts-container"></div>
        <script>
            function logout(){
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
            async function loadposts() {
                try {
                const response = await fetch('http://localhost:3002/posts');
                const data = await response.json();
                const container = document.getElementById('posts-container');
                if(data.success && data.posts.length > 0){
                    data.posts.forEach(post => {
                     const div = document.createElement('div');
                     div.className = 'post';
                     div.innerHTML =`
                     <h3><a href='post.html?id=${post._id}'>${post.title}</a></h3>
                     <p>${post.content}</p>
                     <div class="author">✍️ ${post.author?.name || 'مجهول'}</div>
                     `;
                     container.appendChild(div);

                    });
                }
                else{
                    container.innerHTML ='<p>مفيش مقالات لسه</p>';
                }
                } catch (error) {
                   console.error('خطأ:', error);
                   document.getElementById('post-container').innerHTML = '<p>فشل الاتصال بالسيرفر</p>';
                }
            }
            loadposts();
        </script>
    </body>

</html>
