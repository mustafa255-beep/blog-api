<html>

<head>
    <title>تسجيل مستخدم جديد </title>
</head>

<body>
    <h1>تسجيل مستحدم جديد</h1>
    <input type="text" id="name" placeholder="الاسم">
    <input type="email" id="email" placeholder="الايميل">
    <input type="password" id="password" placeholder="كلمة السر">
    <button onclick="register()">تسجيل الدخول</button>
    <p id="message"></p>
    <script>
        async function register() {
            console.log('✅ دالة التسجيل اشتغلت')
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('http://localhost:3002/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
               const data = await response.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                    document.getElementById('message').textContent = 'تم تسجيل الدخول بنجاح';
                    window.location.href = 'posts.html';
                } else {
                    document.getElementById('message').textContent = 'X' + data.message;
                }
            } catch (error) {
                document.getElementById('message').textContent = 'X خطأ في الاتصال بالسيرفر ';

            }
        }
    </script>
</body>

</html>
